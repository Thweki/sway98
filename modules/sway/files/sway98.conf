# sway98 — Windows 98 window decorations and desktop colour.
# Managed file: re-running install.sh rewrites it, uninstall.sh restores whatever
# was here before. Put your own tweaks in your sway config *above* the include of
# this file, or in ~/.config/sway/conf.d/sway98.d/*.conf for fragments.

# Default font for window titles and the swaybar; the installer picks the first
# of Liberation Sans / DejaVu Sans that is actually installed.
font pango:@FONT@ Bold 9

# 3px grey frame around every window, Win95 style
default_border normal 3
default_floating_border normal 3

#            border   title    text     indicator child
client.focused          #c0c0c0 #000080 #ffffff #c0c0c0 #c0c0c0
client.focused_inactive #c0c0c0 #808080 #c0c0c0 #c0c0c0 #c0c0c0
client.unfocused        #c0c0c0 #808080 #c0c0c0 #c0c0c0 #c0c0c0
client.urgent           #c0c0c0 #800000 #ffffff #c0c0c0 #c0c0c0

# Win95 style cursor (installed by the 'theme' module)
seat * xcursor_theme "Chicago 95 Standard" 24

# The classic teal desktop. Wildcards keep this independent of output names and
# resolution; set your own `output <name> bg ...` before the include to override.
output * bg #008080 solid_color

# Fragments written by the other modules (waybar, sounds, input method, ...).
include ~/.config/sway/conf.d/sway98.d/*.conf
