# sway98 — input method integration for sway.
# fcitx5 has to be reachable through D-Bus and started once per session; without
# these two lines X11 applications in particular never see the input method.

exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway GTK_IM_MODULE QT_IM_MODULE XMODIFIERS SDL_IM_MODULE GLFW_IM_MODULE
exec fcitx5 -d --replace
