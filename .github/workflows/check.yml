name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make shellcheck
      - name: Check syntax, lint, and sandbox roundtrip
        run: |
          [[ "$BASH_VERSINFO" -ge 5 ]]
          [[ "$(id -u)" -ne 0 ]]
          # Discard inherited installer switches and paths before starting tests.
          for variable in "${!SWAY98_@}" "${!XDG_@}"; do
            unset "$variable"
          done
          make check
      - name: Retain synthetic failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-diagnostics
          path: |
            tests/sandbox/*.log
            tests/sandbox/*.diff
          if-no-files-found: ignore
          retention-days: 7
